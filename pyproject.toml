[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avrfs"
version = "0.1.0"
description = "Audio-visual talker tracking with modeled, mode-gated sensor fusion: the microphone misses silence, the camera misses occlusion, and the filter knows which is which"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashmita Chakraborty" }]
keywords = [
  "audio-visual tracking", "sensor fusion", "random finite sets", "PHD filter",
  "speaker tracking", "occlusion", "voice activity", "conformal prediction",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/Dhwaani/av-talkerrfs"

[tool.setuptools]
packages = ["avrfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
